function chamfer(pl,r){if(pl.length<3)return pl;const out=[pl[0]];for(let i=1;i<pl.length-1;i++){const a=pl[i-1],v=pl[i],b=pl[i+1];const d1=[v[0]-a[0],v[1]-a[1]],d2=[b[0]-v[0],b[1]-v[1]];const l1=Math.abs(d1[0])+Math.abs(d1[1]),l2=Math.abs(d2[0])+Math.abs(d2[1]);const o=((d1[0]===0)!==(d2[0]===0))&&((d1[1]===0)!==(d2[1]===0));if(o&&l1>=1.5&&l2>=1.5&&r()<.45){out.push([v[0]-d1[0]/l1,v[1]-d1[1]/l1]);out.push([v[0]+d2[0]/l2,v[1]+d2[1]/l2]);}else out.push(v);}out.push(pl[pl.length-1]);return out;}
function textWidth(str,xh){const U=xh/5,T=.66*U;let x=0;for(const ch of str){const g=FONT.G[ch];x+=(!g)?FONT.SPACE*U:g[0]*U+T+FONT.GAP*U;}return x-FONT.GAP*U;}
function drawText(ctx,str,x,yBase,xh,color,seeds){ // yBase = baseline
  const U=xh/5,T=.66*U,top=yBase-5*U;ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=T;ctx.lineJoin='miter';ctx.miterLimit=4;ctx.lineCap='square';
  let i=0;for(const ch of str){const g=FONT.G[ch];if(!g){x+=FONT.SPACE*U;i++;continue;}const s=seeds?seeds(i):0,r=rng(s),side=T/2;
    g[1].forEach((l)=>{if(l[0]==='d'){ctx.fillRect(x+side+l[1]*U-T/2,top+l[2]*U-T,T,T);return;}const pl=s?chamfer(l,r):l;ctx.beginPath();pl.forEach(([a,b],k)=>k?ctx.lineTo(x+side+a*U,top+b*U):ctx.moveTo(x+side+a*U,top+b*U));ctx.stroke();});
    x+=g[0]*U+T+FONT.GAP*U;i++;}
  ctx.restore();return x;
}
