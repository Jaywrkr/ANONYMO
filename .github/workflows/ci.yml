# En cada push y PR: tipos, contrato, pruebas del pipeline y build de la web.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx tsc -p packages/pipeline/tsconfig.json
      - run: npm run lint
      - run: npm run revisar
      - run: npm run probar
      - name: Comprobar funciones de webs ficticias
        run: |
          mkdir -p "$TMPDIR"
          node --experimental-strip-types scripts/pruebas/funciones-web.ts
        env:
          VERCEL: "1"
          TMPDIR: /tmp/anonymo-chromium-funciones
      - name: Preparar PostgreSQL aislado para pruebas
        run: npm install --prefix "$RUNNER_TEMP/anonymo-postgres" --no-audit --no-fund @embedded-postgres/linux-x64@17.10.0-beta.17
      - name: Comprobar reservas SQL con PostgreSQL real
        run: node scripts/pruebas/cola.mjs
        env:
          POSTGRES_BIN: ${{ runner.temp }}/anonymo-postgres/node_modules/@embedded-postgres/linux-x64/native/bin
      - name: Comprobar publicaciones y recuperación con PostgreSQL real
        run: node --experimental-strip-types scripts/pruebas/publicaciones.mjs
        env:
          POSTGRES_BIN: ${{ runner.temp }}/anonymo-postgres/node_modules/@embedded-postgres/linux-x64/native/bin
      - run: npm run build
      - name: Instalar navegador para ensayo del estudio
        run: npx playwright install --with-deps chromium
      - name: Ensayar estudio móvil y piloto con servicios ficticios
        run: node --experimental-strip-types scripts/pruebas/publicaciones.mjs
        env:
          PROBAR_ESTUDIO_VERSIONADO: "1"
          POSTGRES_BIN: ${{ runner.temp }}/anonymo-postgres/node_modules/@embedded-postgres/linux-x64/native/bin
